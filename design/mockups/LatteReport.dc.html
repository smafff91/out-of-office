<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Latte · Report a problem</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap">
<style>
body{margin:0;font-family:'Geist',system-ui,-apple-system,sans-serif;background:#FAF7F3}
.t{--bg:#FAF7F3;--surface:#FFFFFF;--ink:#1F1712;--muted:#6B5D53;--line:#EAE2D9;--accent:#C8894A;--pill:#F3ECE4;--photo:#D6C6B6;--btn:#1F1712;--btnfg:#FAF7F3;color:var(--ink);font-family:'Geist',system-ui,sans-serif}
a{color:inherit}
.opt{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line);font-size:16px;font-weight:500}
.opt input{width:22px;height:22px;margin:0;accent-color:#1F1712}
</style>
</helmet>
<div class="t" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg)">
<div style="height: 300px; background: var(--photo)" aria-hidden="true"></div>
<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(31,23,18,.45)"></div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 28px 28px 0 0; padding: 10px 20px 28px; display: flex; flex-direction: column; gap: 14px">
<div style="align-self: center; width: 44px; height: 5px; border-radius: 3px; background: var(--line)"></div>
<div style="display: flex; flex-direction: column; gap: 4px; padding-top: 8px">
<span style="font-size: 26px; font-weight: 800; letter-spacing: -0.03em">What's wrong?</span>
<span style="font-size: 14px; color: var(--muted)">Café Tramuntana</span>
</div>
<div style="display: flex; flex-direction: column">
<label class="opt" for="r1"><input id="r1" type="radio" name="r">Closed permanently</label>
<label class="opt" for="r2"><input id="r2" type="radio" name="r" checked>Opening hours are wrong</label>
<label class="opt" for="r3"><input id="r3" type="radio" name="r">Wrong spot on the map</label>
<label class="opt" for="r4"><input id="r4" type="radio" name="r">Laptops no longer allowed</label>
<label class="opt" for="r5"><input id="r5" type="radio" name="r">Inappropriate photo or note</label>
<label class="opt" for="r6" style="border-bottom: 1px solid var(--line)"><input id="r6" type="radio" name="r">Something else</label>
</div>
<textarea id="details" rows="2" aria-label="Details (optional)" placeholder="Details (optional) — e.g. now closes at 18:00" style="border: 1px solid var(--line); border-radius: 14px; padding: 14px; font: 400 15px 'Geist', sans-serif; resize: none; background: var(--bg); color: var(--ink)"></textarea>
<a href="LattePlace.dc.html" style="height: 56px; border-radius: 16px; background: var(--btn); color: var(--btnfg); display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; font-weight: 700">Send report</a>
<span style="font-size: 12px; color: var(--muted)">We review every report. Content that breaks the rules is removed.</span>
</div>
</div>
</x-dc>

</html>
